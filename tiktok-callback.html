<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTok 認可｜itpass-uploader</title><style>
:root{--bg:#0b1226;--fg:#eef2ff;--muted:#aab4d4;--accent:#8fdc5f;--link:#7dd3fc}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.8}
main{max-width:720px;margin:0 auto;padding:40px 16px 64px}
h1{font-size:1.6rem;line-height:1.4}h2{font-size:1.15rem;margin-top:2em;color:var(--accent)}
a{color:var(--link)}p,li{color:var(--fg)}small,.muted{color:var(--muted)}
.head{display:flex;gap:16px;align-items:center}.head img{width:88px;height:88px;border-radius:50%}
footer{margin-top:3em;font-size:.9rem;color:var(--muted)}
</style></head><body><main>
<h1>TikTok の認可</h1>
<p id="msg" class="muted">このページは itpass-uploader が TikTok の認可コードを受け取るためのものです。</p>
<div id="box" style="display:none">
<p>下のコードをコピーして、Claude の案内どおりに使ってください（数分で無効になります。他の人には見せないでください）。</p>
<textarea id="code" readonly style="width:100%;height:120px;font-size:14px;background:#111a33;color:#eef2ff;border:1px solid #33406b;border-radius:8px;padding:8px"></textarea>
<p><button id="copy" style="font-size:16px;padding:8px 16px;border-radius:8px;border:0;background:#8fdc5f;color:#0b1226;font-weight:700">コピー</button> <span id="done" class="muted"></span></p>
</div>
<script>
const q = new URLSearchParams(location.search);
const code = q.get("code"), err = q.get("error");
if (code) {
  document.getElementById("box").style.display = "block";
  document.getElementById("code").value = code;
  document.getElementById("copy").onclick = async () => {
    try { await navigator.clipboard.writeText(code); document.getElementById("done").textContent = "コピーしました"; }
    catch { const t = document.getElementById("code"); t.select(); document.getElementById("done").textContent = "選択しました。長押しでコピーしてください"; }
  };
  history.replaceState(null, "", location.pathname);
} else if (err) {
  document.getElementById("msg").textContent = "認可されませんでした：" + err + " " + (q.get("error_description") || "");
}
</script>
<footer><a href="./">ホーム</a> ・ <a href="privacy.html">プライバシーポリシー</a> ・ <a href="terms.html">利用規約</a></footer></main></body></html>
